name: Pi Durable Edge checks
on:
  push:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/pi-durable-edge.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/pi-durable-edge.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir dist-cf
